<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Contato</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main id="container">
    <form>
      <h2>Contate-nos</h2>

      <div class="grid1">
        <div class="form-control">
          <label for="nome">Nome <span class="span">*</span></label>
          <input type="text" name="nome" id="nome" required>
        </div>

        <div class="form-control">
          <label for="sobrenome">Sobre-nome <span class="span">*</span></label>
          <input type="text" name="sobrenome" id="sobrenome" required>
        </div>
      </div>

      <div class="form-control">
        <label for="email">Email <span class="span">*</span> </label>
        <input type="email" name="Email" id="email" required>
      </div>

      <div class="form-control">
        <label>Tipo de consulta <span class="span">*</span></label>
        <div class="grid1">
          <label class="radio-box">
            <input type="radio" name="consulta" value="duvidas">
            <span>Duvidas</span>
          </label>
          <label class="radio-box">
            <input type="radio" name="consulta" value="Suporte" required>
            <span>Suporte</span>
          </label>
        </div>
      </div>

      <div class="form-control">
        <label for="comentario">Mensagem:</label>
        <textarea name="comentario" id="comentario" rows="4" placeholder="Escreva aqui..." required></textarea>
      </div>

      <div class="checkbox-control">
        <label for="aceito">
          <input type="checkbox" name="aceito" id="aceito" required> Concordo em ser contatado pela equipe<span class="span">*</span>
        </label>
      </div>

      <button type="submit" class="button">Enviar</button>
    </form>
  </main>
</body>

</html>
